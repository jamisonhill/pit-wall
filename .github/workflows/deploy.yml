# Build the Pit Wall image and push it to GitHub Container Registry on every push to
# main. Watchtower on the NAS then auto-updates the running container. This mirrors
# your existing ghcr.io/jamisonhill/* deployment flow (aquarium, devotional-app, etc.).

name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # linux/amd64 matches the Synology DS918+ (x86_64).
          platforms: linux/amd64
          tags: |
            ghcr.io/jamisonhill/pit-wall:latest
            ghcr.io/jamisonhill/pit-wall:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
